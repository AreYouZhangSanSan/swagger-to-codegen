    <!-- Card 7 -->
    <g transform="translate(1405,270)" filter="url(#shadow)">
      <rect width="202" height="302" rx="18" fill="#fff" stroke="#9eb2c6" stroke-width="2"/>
      <path d="M18 0H184Q202 0 202 18V84H0V18Q0 0 18 0Z" fill="#355773"/>
      <circle cx="24" cy="24" r="15" fill="#fff" fill-opacity="0.18"/>
