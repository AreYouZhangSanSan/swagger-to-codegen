      <path d="M20 25l6 6 11-13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="112.5" y="55" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">zdwp-aquasage-web</text>
      <g text-anchor="middle">
        <text x="112.5" y="148" font-size="22" font-weight="700" fill="#126b58">全项目 CRUD</text>
        <rect x="40" y="184" width="145" height="48" rx="24" fill="#ccefe5"/>
        <text x="112.5" y="216" font-size="20" font-weight="700" fill="#0c765f">可直接使用</text>
      </g>
    </g>

    <!-- Dotted audit connections -->
    <g fill="none" stroke="#6f91aa" stroke-width="3" stroke-dasharray="8 8">
      <path d="M606 573V668H250V705"/>
      <path d="M1056 573V645H848V705"/>
      <path d="M1506 573V668H1110V705"/>
    </g>

    <!-- Audit metadata -->
    <g transform="translate(65,705)" filter="url(#shadow)">
      <rect width="1225" height="290" rx="22" fill="#fff" stroke="#b7d2df" stroke-width="2"/>
      <rect width="1225" height="68" rx="22" fill="#e0f0f6"/>
      <rect y="45" width="1225" height="23" fill="#e0f0f6"/>
      <text x="36" y="44" class="meta-title">.codegen 可审计元数据</text>

      <g transform="translate(36,98)">
        <rect width="270" height="145" rx="16" fill="#f3f9fc" stroke="#b9d4e2" stroke-width="2"/>
        <circle cx="38" cy="42" r="20" fill="#14879c"/>
        <text x="38" y="49" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">P</text>
        <text x="72" y="41" class="meta-title">计划 Plans</text>
        <text x="72" y="73" class="meta-sub">资源、CRUD、落位、分页</text>
        <text x="72" y="103" class="meta-sub">记录“准备生成什么”</text>
      </g>

      <g transform="translate(330,98)">
        <rect width="270" height="145" rx="16" fill="#f3f9fc" stroke="#b9d4e2" stroke-width="2"/>
        <circle cx="38" cy="42" r="20" fill="#416bc0"/>
        <text x="38" y="49" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">M</text>
        <text x="72" y="41" class="meta-title">清单 Manifest</text>
        <text x="72" y="73" class="meta-sub">文件路径与生成哈希</text>
        <text x="72" y="103" class="meta-sub">判断“是否人工修改”</text>
      </g>

      <g transform="translate(624,98)">
        <rect width="270" height="145" rx="16" fill="#f3f9fc" stroke="#b9d4e2" stroke-width="2"/>
        <circle cx="38" cy="42" r="20" fill="#615db5"/>
        <text x="38" y="49" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">B</text>
        <text x="72" y="41" class="meta-title">备份 Backups</text>
        <text x="72" y="73" class="meta-sub">覆盖前保存原始文件</text>
        <text x="72" y="103" class="meta-sub">支持恢复与追溯</text>
      </g>

      <g transform="translate(918,98)">
        <rect width="270" height="145" rx="16" fill="#f3f9fc" stroke="#b9d4e2" stroke-width="2"/>
        <circle cx="38" cy="42" r="20" fill="#355773"/>
        <text x="38" y="49" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">R</text>
        <text x="72" y="41" class="meta-title">报告 Reports</text>
        <text x="72" y="73" class="meta-sub">动作、路由、诊断结果</text>
        <text x="72" y="103" class="meta-sub">记录“本次做了什么”</text>
      </g>
    </g>

    <!-- Secondary LLM path -->
    <g transform="translate(1330,705)" filter="url(#shadow)">
      <rect width="525" height="290" rx="22" fill="#fffaf3" stroke="#e4b377" stroke-width="2"/>
      <rect width="525" height="68" rx="22" fill="#f9e6cc"/>
      <rect y="45" width="525" height="23" fill="#f9e6cc"/>
      <text x="32" y="44" font-size="22" font-weight="700" fill="#925515">辅助链路（非主流程）</text>
      <g transform="translate(44,103)">
        <rect width="184" height="112" rx="16" fill="#fff" stroke="#e7bd87" stroke-width="2"/>
        <text x="92" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#925515">参考模板 + LLM</text>
        <text x="92" y="79" text-anchor="middle" font-size="16" font-weight="500" fill="#a6743d">页面表达与风格</text>
      </g>
      <path d="M247 159H289" fill="none" stroke="#e28a32" stroke-width="4" stroke-dasharray="8 7" marker-end="url(#arrowOrange)"/>
      <g transform="translate(304,103)">
        <rect width="177" height="112" rx="16" fill="#fff" stroke="#e7bd87" stroke-width="2"/>
        <text x="88.5" y="46" text-anchor="middle" font-size="18" font-weight="700" fill="#925515">style / page</text>
        <text x="88.5" y="78" text-anchor="middle" font-size="18" font-weight="700" fill="#925515">generate</text>
      </g>
      <text x="262.5" y="256" text-anchor="middle" font-size="16" font-weight="500" fill="#a6743d">不参与主流程的接口、字段和写入决策</text>
    </g>
  </g>
</svg>
