<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#edf7f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16324f" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f7396"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e28a32"/>
    </marker>
    <style>
      .font { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .title { font-size: 48px; font-weight: 700; fill: #123653; }
      .subtitle { font-size: 24px; font-weight: 400; fill: #547087; }
      .section { font-size: 23px; font-weight: 700; fill: #284b67; }
      .card-title { font-size: 21px; font-weight: 700; fill: #ffffff; }
      .card-text { font-size: 18px; font-weight: 500; fill: #29475f; }
      .small { font-size: 16px; font-weight: 500; fill: #527086; }
      .meta-title { font-size: 22px; font-weight: 700; fill: #173e5b; }
      .meta-sub { font-size: 16px; font-weight: 500; fill: #617d90; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g opacity="0.35" stroke="#cfe2eb" stroke-width="1">
    <path d="M0 180H1920 M0 360H1920 M0 540H1920 M0 720H1920 M0 900H1920"/>
    <path d="M240 0V1080 M480 0V1080 M720 0V1080 M960 0V1080 M1200 0V1080 M1440 0V1080 M1680 0V1080"/>
  </g>

  <g class="font">
    <text class="title" x="72" y="82">Swagger to Codegen 总体架构</text>
    <text class="subtitle" x="74" y="126">面向 zdwp-aquasage-web 的确定性 CRUD 代码生成流水线</text>

    <g transform="translate(1530,55)">
      <rect width="315" height="64" rx="32" fill="#d9f4ec" stroke="#76c6af" stroke-width="2"/>
      <circle cx="34" cy="32" r="13" fill="#149775"/>
      <path d="M28 32l5 5 9-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="58" y="40" font-size="21" font-weight="700" fill="#126b57">主流程不使用 LLM</text>
    </g>

    <text class="section" x="72" y="222">确定性主流程</text>
    <line x1="244" y1="214" x2="1844" y2="214" stroke="#bed2df" stroke-width="2"/>

    <!-- Main arrows -->
    <g fill="none" stroke="#4f7396" stroke-width="4" marker-end="url(#arrow)">
      <path d="M257 421H276"/>
      <path d="M482 421H501"/>
      <path d="M707 421H726"/>
      <path d="M932 421H951"/>
      <path d="M1157 421H1176"/>
      <path d="M1382 421H1401"/>
      <path d="M1607 421H1626"/>
    </g>

    <!-- Card 1 -->
    <g transform="translate(55,270)" filter="url(#shadow)">
      <rect width="202" height="302" rx="18" fill="#fff" stroke="#a9c4d5" stroke-width="2"/>
      <path d="M18 0H184Q202 0 202 18V84H0V18Q0 0 18 0Z" fill="#174f7d"/>
      <circle cx="24" cy="24" r="15" fill="#fff" fill-opacity="0.18"/>
      <text x="24" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
      <text class="card-title" x="101" y="58" text-anchor="middle">OpenAPI 输入</text>
      <g class="card-text" text-anchor="middle">
        <text x="101" y="145">URL</text>
        <text x="101" y="186">JSON</text>
        <text x="101" y="227">YAML</text>
      </g>
    </g>

    <!-- Card 2 -->
    <g transform="translate(280,270)" filter="url(#shadow)">
      <rect width="202" height="302" rx="18" fill="#fff" stroke="#a9c4d5" stroke-width="2"/>
      <path d="M18 0H184Q202 0 202 18V84H0V18Q0 0 18 0Z" fill="#236ba3"/>
      <circle cx="24" cy="24" r="15" fill="#fff" fill-opacity="0.18"/>
      <text x="24" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text>
      <text class="card-title" x="101" y="48" text-anchor="middle">契约解析</text>
      <text x="101" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="#dbefff">parser</text>
      <g class="card-text" text-anchor="middle">
        <text x="101" y="137">文档校验</text>
        <text x="101" y="184">参数归一</text>
        <text x="101" y="231">Schema 提取</text>
      </g>
    </g>

    <!-- Card 3 -->
    <g transform="translate(505,270)" filter="url(#shadow)">
      <rect width="202" height="302" rx="18" fill="#fff" stroke="#94c8d3" stroke-width="2"/>
      <path d="M18 0H184Q202 0 202 18V84H0V18Q0 0 18 0Z" fill="#13879c"/>
      <circle cx="24" cy="24" r="15" fill="#fff" fill-opacity="0.18"/>
      <text x="24" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
      <text class="card-title" x="101" y="48" text-anchor="middle">资源规划</text>
      <text x="101" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="#d9f4f6">planner</text>
      <g class="card-text" text-anchor="middle">
        <text x="101" y="130">资源拆分</text>
        <text x="101" y="176">CRUD 识别</text>
        <text x="101" y="222">字段与分页计划</text>
      </g>
    </g>

    <!-- Card 4 -->
    <g transform="translate(730,270)" filter="url(#shadow)">
      <rect width="202" height="302" rx="18" fill="#fff" stroke="#93cabc" stroke-width="2"/>
      <path d="M18 0H184Q202 0 202 18V84H0V18Q0 0 18 0Z" fill="#12937d"/>
      <circle cx="24" cy="24" r="15" fill="#fff" fill-opacity="0.18"/>
      <text x="24" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text>
      <text class="card-title" x="101" y="48" text-anchor="middle">页面落位</text>
      <text x="101" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="#dcf6ee">placement</text>
      <g class="card-text" text-anchor="middle">
        <text x="101" y="124">参考模块</text>
        <text x="101" y="163">目标父路由</text>
        <text x="101" y="202">目录与命名空间</text>
        <text x="101" y="241">菜单模式</text>
      </g>
    </g>

    <!-- Card 5 -->
    <g transform="translate(955,270)" filter="url(#shadow)">
      <rect width="202" height="302" rx="18" fill="#fff" stroke="#a7bbdd" stroke-width="2"/>
      <path d="M18 0H184Q202 0 202 18V84H0V18Q0 0 18 0Z" fill="#426bc2"/>
      <circle cx="24" cy="24" r="15" fill="#fff" fill-opacity="0.18"/>
      <text x="24" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">5</text>
