      <text x="101" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="#e6edff">renderer</text>
      <g class="card-text" text-anchor="middle">
        <text x="101" y="124">Service / 类型</text>
        <text x="101" y="163">配置 / Vue 页面</text>
        <text x="101" y="202">增量更新</text>
        <text x="101" y="241">冲突保护</text>
